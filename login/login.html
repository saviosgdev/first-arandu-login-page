<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar</title>
  <style>
    :root {
      --fundo: #eef2f7;
      --cartao: #ffffff;
      --texto: #1b2433;
      --texto-suave: #5d6b82;
      --borda: #cdd5e1;
      --destaque: #2457d6;
      --destaque-hover: #1b43a8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fundo: #121722;
        --cartao: #1c2332;
        --texto: #eef1f7;
        --texto-suave: #9aa7bd;
        --borda: #333e55;
        --destaque: #6b94ff;
        --destaque-hover: #8aaaff;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--fundo);
      color: var(--texto);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .login {
      width: 100%;
      max-width: 380px;
      padding: 36px 32px;
      background: var(--cartao);
      border: 1px solid var(--borda);
      border-radius: 12px;
    }

    .login h1 {
      margin: 0 0 6px;
      font-size: 1.6rem;
    }

    .login p {
      margin: 0 0 24px;
      color: var(--texto-suave);
      font-size: 0.95rem;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      margin-bottom: 18px;
      padding: 11px 12px;
      font-size: 1rem;
      color: var(--texto);
      background: transparent;
      border: 1px solid var(--borda);
      border-radius: 8px;
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--destaque);
      outline-offset: 2px;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: var(--destaque);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover { background: var(--destaque-hover); }

    .links {
      margin-top: 18px;
      font-size: 0.9rem;
      text-align: center;
    }

    .links a { color: var(--destaque); }
  </style>
</head>
<body>
  <main class="login">
    <h1>Entrar</h1>
    <p>Acesse sua conta para continuar.</p>

    <form action="#" method="post">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="voce@exemplo.com" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

      <button type="submit">Entrar</button>
    </form>

    <div class="links">
      <a href="#">Esqueci minha senha</a>
    </div>
  </main>
</body>
</html>
